    <body>

        <h1>Employee Job Application Form</h1>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="">Full Name:</label> <input type="text">
            <br><br>
            <label for="">Gender:</label> <input type="radio" name="B">Male <input type="radio" name="B">Female <input type="radio" name="B">Gay
            <br><br>
            <label for="">Date of Birth:</label> <input type="date">
            <br><br>
            <label for="">Email:</label> <input type="email">
            <br><br>
            <label for="">Phone:</label> <input type="tel">
            <br><br>
            <label for="">Address:</label> <textarea name="" id=""></textarea>
        </fieldset>
        <fieldset>
            <legend>Education and Employment</legend>
            <label for="">Education:</label>
            <select>
                <option value="">High School</option>
            </select>
            <br><br>
            <label for="">University:</label> <input type="text">
            <br><br>
            <label for="">Position:</label> <input type="text">
            <br><br>
            <label for="">Experience (Year):</label> <input type="text">
            <br><br>
            <label for="">Expected Salary ($):</label> <input type="text">
            <br><br>
            <label for="">Skills:</label> <input type="checkbox" name="b">HTML <input type="checkbox" name="B">Python <input type="checkbox" name="B">Database <input type="checkbox" name="B">Networking
        </fieldset>
        <fieldset>
            <legend>Documents</legend>
            <label for="">Upload CV:</label> <input type="file">
            <br><br>
            <label for="">Upload Photo:</label> <input type="file">
            <br><br>
            <label for="">Available  Date:</label> <input type="date">
            <br><br>
            <label for="">Cover Letter:</label>
            <br> <textarea name="B" id=""></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Apply Now">
        <input type="submit" value="Clear Form">
    </body>
</html>
