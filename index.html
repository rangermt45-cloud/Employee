    <body>

        <h1>Student Registration Form</h1>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="">Full Name:</label> <input type="text" placeholder="Enter your full name">
            <br><br>
            <label for="">Email:</label> <input type="email" placeholder="example@gmail.com">
            <br><br>
            <label for="">Password:</label> <input type="password" placeholder="">
            <br><br>
            <label for="">Date of Birth:</label> <input type="date" placeholder="">
            <br><br>
            <label for="">Gender:</label> <input type="radio" name="B">Male <input type="radio" name="B">Female <input type="radio" name="B">Gay
            <br><br>
            <label for="">Phone:</label> <input type="tel">
        </fieldset>
        <fieldset>
            <legend>Academic Information</legend>
            <label for="">Student ID:</label> <input type="text">
            <br><br>
            <label for="">Major:</label>
            <select>
                <option value="">Select Major</option>
                <option value="">IT</option>
                <option value="">Deviloper</option>
            </select>
            <label for="">Skills:</label> <input type="checkbox" name="B">HTML <input type="checkbox" name="B">CSS <input type="checkbox" name="B">JavaScript
            <br><br>
            <label for="">Upload Photo:</label> <input type="file" name="B">
        </fieldset>
        <fieldset>
            <legend>Additional Information</legend>
            <label for="">Address:</label>
            <br> <textarea name="B" id=""></textarea>
            <br><br>
            <label for="">Personal:</label> <input type="text">
            <br><br>
            <label for="">Favorite:</label> <input type="color">
        </fieldset>
        <br>
        <input type="checkbox">I agree to the registration terms.
        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </body>
</html>
